<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TekiLive — Live Captions</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D1321; --panel:#141B2E; --panel-2:#1B2439; --border:#263047;
    --violet:#7C3AED; --blue:#2563EB; --sky:#38BDF8; --gray:#8A93A6; --white:#F5F6FA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'Poppins', system-ui, sans-serif; background:var(--ink); color:var(--white);}

  /* ---- Language picker screen ---- */
  #picker{min-height:100vh; display:flex; flex-direction:column; padding:32px 22px; }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:34px;}
  .brand-mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--violet), var(--blue)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; overflow:hidden; flex-shrink:0;}
  .brand-mark.small{width:18px; height:18px; border-radius:5px; font-size:8px;}
  .brand-mark img{width:100%; height:100%; object-fit:contain; display:none; background:#fff;}
  .brand-name{font-size:16px; font-weight:600;}
  .session-line{font-size:13px; color:var(--gray); margin-top:1px;}
  h1{font-size:22px; font-weight:600; margin-bottom:6px;}
  .lede{font-size:14px; color:var(--gray); margin-bottom:26px; line-height:1.5;}
  .lang-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .lang-btn{background:var(--panel); border:1px solid var(--border); color:var(--white); font-family:inherit; font-size:15px; font-weight:500; padding:18px; border-radius:14px; cursor:pointer; text-align:left;}
  .lang-btn:active{border-color:var(--violet); background:rgba(124,58,237,.14);}

  .event-brand{display:none; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:24px;}
  .event-brand img{height:34px; width:auto; max-width:72px; object-fit:contain; background:#fff; border-radius:6px; padding:3px; display:none;}
  .event-brand-text .event-name{font-size:14px; font-weight:600;}
  .event-brand-text .org-name{font-size:12px; color:var(--gray); margin-top:2px;}

  .picker-footer{margin-top:auto; padding-top:28px; display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--gray);}

  /* ---- Caption screen ---- */
  #captions{display:none; height:100vh; flex-direction:column; padding:26px 22px;}
  .cap-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px;}
  .cap-lang{font-size:13px; color:var(--sky); font-weight:600;}
  .cap-actions{display:flex; gap:8px;}
  .change-btn{background:none; border:1px solid var(--border); color:var(--gray); font-family:inherit; font-size:12.5px; padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .change-btn.voice-on{border-color:var(--violet); color:var(--white); background:rgba(124,58,237,.18);}
  .cap-status{display:flex; align-items:center; justify-content:space-between; gap:7px; font-size:12px; color:var(--gray); margin-bottom:14px;}
  .cap-status-left{display:flex; align-items:center; gap:7px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--gray);}
  .dot.live{background:#34D399;}

  .textsize{display:flex; align-items:center; gap:6px;}
  .size-btn{width:26px; height:26px; border-radius:7px; border:1px solid var(--border); background:var(--panel); color:var(--white); font-family:inherit; font-size:14px; font-weight:600; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .size-btn:active{border-color:var(--violet); background:rgba(124,58,237,.14);}
  .size-btn:disabled{opacity:.35; cursor:not-allowed;}

  .cap-feed{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:14px; overflow-y:auto; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;}
  .cap-line{font-size:calc(clamp(20px, 5.5vw, 28px) * var(--font-scale, 1)); line-height:1.5; font-weight:500; opacity:1; animation:capIn .3s ease-out;}
  .cap-line.placeholder{color:var(--gray); font-weight:400; font-size:16px; animation:none;}
  .cap-feed .cap-line:not(:last-child):nth-last-child(2){opacity:.55;}
  .cap-feed .cap-line:not(:last-child):not(:nth-last-child(2)){opacity:.3;}
  @keyframes capIn{from{opacity:0; transform:translateY(10px);} to{transform:translateY(0);}}

  .cap-branding{flex-shrink:0; display:none; align-items:center; justify-content:center; gap:8px; padding-top:12px; margin-top:12px; border-top:1px solid var(--border);}
  .cap-branding img{height:16px; width:auto; max-width:40px; object-fit:contain; background:#fff; border-radius:3px; padding:2px; display:none;}
  .cap-branding-sep{color:var(--border); font-size:10px;}
</style>
</head>
<body>

<div id="picker">
  <div class="brand">
    <div class="brand-mark">
      <span>TL</span>
      <img src="/branding/tekiminds-logo.png" alt="TekiMinds" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.remove();">
    </div>
    <div>
      <div class="brand-name">TekiLive</div>
      <div class="session-line" id="sessionLine">Session —</div>
    </div>
  </div>

  <div class="event-brand" id="eventBrand">
    <img id="eventBrandEventLogo" alt="">
    <img id="eventBrandOrgLogo" alt="">
    <div class="event-brand-text">
      <div class="event-name" id="eventBrandEventName"></div>
      <div class="org-name" id="eventBrandOrgName"></div>
    </div>
  </div>

  <h1>Choose your language</h1>
  <div class="lede">Live captions from the stage, translated for you in real time. Read them on screen, or turn on voice afterward to hear them through headphones.</div>
  <div class="lang-grid" id="langGrid"></div>

  <div class="picker-footer">
    <div class="brand-mark small">
      <span>TL</span>
      <img src="/branding/tekiminds-logo.png" alt="TekiMinds" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.remove();">
    </div>
    <span>Powered by TekiMinds</span>
  </div>
</div>

<div id="captions">
  <div class="cap-top">
    <span class="cap-lang" id="capLangName"></span>
    <div class="cap-actions">
      <button class="change-btn" id="voiceBtn">Voice: off</button>
      <button class="change-btn" id="changeBtn">Change language</button>
    </div>
  </div>
  <div class="cap-status">
    <span class="cap-status-left"><span class="dot" id="capDot"></span><span id="capStatusText">Connecting…</span></span>
    <span class="textsize">
      <button class="size-btn" id="fontDecBtn" aria-label="Decrease text size">A−</button>
      <button class="size-btn" id="fontIncBtn" aria-label="Increase text size">A+</button>
    </span>
  </div>
  <div class="cap-feed" id="capFeed"><div class="cap-line placeholder" id="capPlaceholder">Waiting for the speaker to start…</div></div>
  <div class="cap-branding" id="capBranding">
    <div class="brand-mark small">
      <span>TL</span>
      <img src="/branding/tekiminds-logo.png" alt="TekiMinds" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.remove();">
    </div>
    <span class="cap-branding-sep">·</span>
    <img id="capBrandingEventLogo" alt="">
    <img id="capBrandingOrgLogo" alt="">
  </div>
</div>

<script>
const LANGUAGES = [
  { code:'en', name:'English',    speech:'en-US' },
  { code:'ar', name:'Arabic',     speech:'ar-SA' },
  { code:'fr', name:'French',     speech:'fr-FR' },
  { code:'es', name:'Spanish',    speech:'es-ES' },
  { code:'de', name:'German',     speech:'de-DE' },
  { code:'zh', name:'Chinese',    speech:'zh-CN' },
  { code:'pt', name:'Portuguese', speech:'pt-PT' },
  { code:'ru', name:'Russian',    speech:'ru-RU' },
  { code:'hi', name:'Hindi',      speech:'hi-IN' },
  { code:'tr', name:'Turkish',    speech:'tr-TR' },
];

const params = new URLSearchParams(location.search);
const sessionCode = (params.get('session') || 'DEMO').toUpperCase();
document.getElementById('sessionLine').textContent = `Session ${sessionCode}`;

const grid = document.getElementById('langGrid');
LANGUAGES.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'lang-btn';
  btn.textContent = l.name;
  btn.addEventListener('click', () => joinAs(l));
  grid.appendChild(btn);
});

function showImg(imgEl, src){
  if (src){ imgEl.src = src; imgEl.style.display = 'block'; }
  else { imgEl.style.display = 'none'; imgEl.removeAttribute('src'); }
}

function renderBranding(b){
  const bust = Date.now();
  const eventLogoSrc = b.hasEventLogo ? `/api/session/${sessionCode}/logo/event?t=${bust}` : null;
  const orgLogoSrc = b.hasOrgLogo ? `/api/session/${sessionCode}/logo/org?t=${bust}` : null;

  const eventBrand = document.getElementById('eventBrand');
  eventBrand.style.display = (b.eventName || b.orgName || eventLogoSrc || orgLogoSrc) ? 'flex' : 'none';
  showImg(document.getElementById('eventBrandEventLogo'), eventLogoSrc);
  showImg(document.getElementById('eventBrandOrgLogo'), orgLogoSrc);
  document.getElementById('eventBrandEventName').textContent = b.eventName || '';
  document.getElementById('eventBrandOrgName').textContent = b.orgName ? `Presented by ${b.orgName}` : '';

  const capBranding = document.getElementById('capBranding');
  capBranding.style.display = (eventLogoSrc || orgLogoSrc) ? 'flex' : 'none';
  showImg(document.getElementById('capBrandingEventLogo'), eventLogoSrc);
  showImg(document.getElementById('capBrandingOrgLogo'), orgLogoSrc);
}

fetch(`/api/session/${sessionCode}/branding`)
  .then(res => res.ok ? res.json() : null)
  .then(b => { if (b) renderBranding(b); })
  .catch(() => {});

const MAX_CAPTION_LINES = 40;
const capFeed = document.getElementById('capFeed');

function isNearBottom(el){
  return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
}

function addCaptionLine(text){
  const placeholder = document.getElementById('capPlaceholder');
  if (placeholder) placeholder.remove();
  const wasNearBottom = isNearBottom(capFeed);
  const line = document.createElement('div');
  line.className = 'cap-line';
  line.textContent = text;
  capFeed.appendChild(line);
  while (capFeed.children.length > MAX_CAPTION_LINES) capFeed.removeChild(capFeed.firstChild);
  if (wasNearBottom) capFeed.scrollTop = capFeed.scrollHeight;
}

const RTL_LANGS = ['ar'];

// Caption text size, adjustable per viewer and remembered on this device.
const FONT_SCALE_MIN = 0.75;
const FONT_SCALE_MAX = 1.75;
const FONT_SCALE_STEP = 0.125;
const FONT_SCALE_STORAGE_KEY = 'tekilive-font-scale';
const fontDecBtn = document.getElementById('fontDecBtn');
const fontIncBtn = document.getElementById('fontIncBtn');
let fontScale = 1;
try {
  const saved = parseFloat(localStorage.getItem(FONT_SCALE_STORAGE_KEY));
  if (!isNaN(saved) && saved >= FONT_SCALE_MIN && saved <= FONT_SCALE_MAX) fontScale = saved;
} catch (e) {}

function applyFontScale(){
  document.documentElement.style.setProperty('--font-scale', fontScale);
  fontDecBtn.disabled = fontScale <= FONT_SCALE_MIN;
  fontIncBtn.disabled = fontScale >= FONT_SCALE_MAX;
  try { localStorage.setItem(FONT_SCALE_STORAGE_KEY, fontScale); } catch (e) {}
}
applyFontScale();

fontDecBtn.addEventListener('click', () => {
  fontScale = Math.max(FONT_SCALE_MIN, +(fontScale - FONT_SCALE_STEP).toFixed(3));
  applyFontScale();
});
fontIncBtn.addEventListener('click', () => {
  fontScale = Math.min(FONT_SCALE_MAX, +(fontScale + FONT_SCALE_STEP).toFixed(3));
  applyFontScale();
});

// Voice reads captions aloud via the device's own speech synthesis — no
// server round trip, no API key. Off by default: auto-playing audio from
// a phone speaker in a quiet room would be disruptive, so this is an
// explicit opt-in for someone with headphones in.
const SPEECH_SUPPORTED = 'speechSynthesis' in window;
const MAX_QUEUED_UTTERANCES = 3;
const voiceBtn = document.getElementById('voiceBtn');
let voiceEnabled = false, speechLocale = 'en-US', queuedUtterances = 0;

if (!SPEECH_SUPPORTED) voiceBtn.style.display = 'none';

function speakCaption(text){
  if (!voiceEnabled || !SPEECH_SUPPORTED) return;
  if (queuedUtterances >= MAX_QUEUED_UTTERANCES) return; // falling behind — stay live rather than read a growing backlog
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = speechLocale;
  queuedUtterances++;
  utter.onend = utter.onerror = () => { queuedUtterances = Math.max(0, queuedUtterances - 1); };
  speechSynthesis.speak(utter);
}

function setVoiceEnabled(on){
  voiceEnabled = on;
  voiceBtn.textContent = on ? 'Voice: on' : 'Voice: off';
  voiceBtn.classList.toggle('voice-on', on);
  if (!SPEECH_SUPPORTED) return;
  speechSynthesis.cancel();
  queuedUtterances = 0;
  if (on){
    // Mobile browsers (iOS Safari especially) only allow speech synthesis
    // triggered synchronously from a user tap — a later speak() call from
    // an async WebSocket message can be silently blocked otherwise. Speak
    // an audible confirmation right in this click handler to unlock it,
    // and to prove out loud that voice actually works on this device.
    const confirm = new SpeechSynthesisUtterance('Voice on');
    confirm.lang = speechLocale;
    confirm.onerror = () => {
      voiceEnabled = false;
      voiceBtn.textContent = 'Voice: off';
      voiceBtn.classList.remove('voice-on');
      document.getElementById('capStatusText').textContent = 'Voice unavailable on this device';
    };
    speechSynthesis.speak(confirm);
  }
}

voiceBtn.addEventListener('click', () => setVoiceEnabled(!voiceEnabled));

let ws = null, manualClose = false;
function joinAs(lang){
  document.getElementById('picker').style.display = 'none';
  document.getElementById('captions').style.display = 'flex';
  document.getElementById('capLangName').textContent = lang.name;
  capFeed.dir = RTL_LANGS.includes(lang.code) ? 'rtl' : 'ltr';
  speechLocale = lang.speech;
  connect(lang.code);
}

document.getElementById('changeBtn').addEventListener('click', () => {
  manualClose = true;
  if (ws) ws.close();
  setVoiceEnabled(false);
  document.getElementById('captions').style.display = 'none';
  document.getElementById('picker').style.display = 'flex';
  capFeed.innerHTML = '<div class="cap-line placeholder" id="capPlaceholder">Waiting for the speaker to start…</div>';
});

const WS_STALE_TIMEOUT_MS = 28000; // just over 2x the server's 12s heartbeat
let lastServerMessageAt = Date.now(), staleWatchdog = null;

function connect(langCode){
  manualClose = false;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}?role=audience&session=${sessionCode}&lang=${langCode}`);
  lastServerMessageAt = Date.now();
  const dot = document.getElementById('capDot');
  const statusText = document.getElementById('capStatusText');

  ws.onopen = () => { dot.classList.add('live'); statusText.textContent = 'Connected — waiting for speech'; };
  ws.onclose = () => {
    dot.classList.remove('live');
    if (manualClose) return;
    statusText.textContent = 'Disconnected — reconnecting…';
    setTimeout(() => connect(langCode), 1500);
  };
  ws.onmessage = (evt) => {
    lastServerMessageAt = Date.now();
    const msg = JSON.parse(evt.data);
    if (msg.type === 'caption'){
      addCaptionLine(msg.text);
      speakCaption(msg.text);
      statusText.textContent = `Live — ${msg.latency}ms`;
    }
    if (msg.type === 'joined' && msg.branding) renderBranding(msg.branding);
    if (msg.type === 'branding') renderBranding(msg.branding);
  };

  // The server sends an app-level heartbeat every 12s regardless of
  // caption activity, so silence beyond that reliably means the socket
  // is dead — force a clean reconnect instead of waiting on readyState
  // to catch up (which can lag a genuinely dead connection by up to a
  // minute and just silently drop captions in the meantime).
  if (staleWatchdog) clearInterval(staleWatchdog);
  staleWatchdog = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN && Date.now() - lastServerMessageAt > WS_STALE_TIMEOUT_MS){
      ws.close();
    }
  }, 5000);
}
</script>
</body>
</html>
