<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TekiLive — Admin Overview</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D1321; --panel:#141B2E; --panel-2:#1B2439; --border:#263047;
    --violet:#7C3AED; --blue:#2563EB; --sky:#38BDF8; --gray:#8A93A6; --white:#F5F6FA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Poppins', system-ui, sans-serif; background:var(--ink); color:var(--white); min-height:100vh;}
  .wrap{max-width:1120px; margin:0 auto; padding:32px 24px 64px;}
  header{display:flex; align-items:center; justify-content:space-between; padding-bottom:24px; border-bottom:1px solid var(--border); margin-bottom:24px; flex-wrap:wrap; gap:16px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg, var(--violet), var(--blue)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; overflow:hidden; flex-shrink:0;}
  .brand-mark img{width:100%; height:100%; object-fit:contain; display:none; background:#fff;}
  .brand-name{font-size:18px; font-weight:600;}
  .brand-sub{font-size:12.5px; color:var(--gray); margin-top:1px;}

  label{display:block; font-size:12.5px; color:var(--gray); margin-bottom:7px; font-weight:500;}
  input, select{width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--white); font-family:inherit; padding:10px 12px; border-radius:10px; font-size:14px;}
  .gradient-btn{background:linear-gradient(90deg, var(--violet) 0%, var(--blue) 100%); border:none; color:#fff; font-family:inherit; font-weight:600; padding:11px 20px; border-radius:10px; cursor:pointer; font-size:14px;}
  .gradient-btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--white); font-family:inherit; font-weight:500; padding:10px 16px; border-radius:10px; cursor:pointer; font-size:13px;}
  a.btn-outline{display:inline-block; text-decoration:none;}
  .header-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:24px;}
  .panel-title{font-size:13px; font-weight:600; color:var(--gray); margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
  .empty-note{font-size:13.5px; color:var(--gray); padding:14px 0;}

  .session-card{border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px;}
  .session-card:last-child{margin-bottom:0;}
  .session-card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .session-code{font-size:15px; font-weight:600; color:var(--sky);}
  .session-event{font-size:12.5px; color:var(--gray);}
  .badge{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px;}
  .badge.live{background:rgba(52,211,153,.15); color:#34D399;}
  .badge.idle{background:rgba(138,147,166,.15); color:var(--gray);}
  .lang-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .lang-chip{font-size:12px; background:var(--panel-2); border:1px solid var(--border); padding:4px 10px; border-radius:999px;}

  .provider-now{font-size:14px; margin-bottom:6px;}
  .provider-warning{font-size:13px; color:#F59E0B; margin-bottom:10px; display:none;}
  .provider-grid{display:grid; grid-template-columns:1fr 1.6fr 1fr; gap:12px; align-items:end; margin:14px 0 12px;}
  @media (max-width:900px){ .provider-grid{grid-template-columns:1fr;} }
  .provider-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .form-status{font-size:12.5px; color:var(--gray); margin-top:8px;}
  .form-status.error{color:#F59E0B;}

  .login-wrap{max-width:380px; margin:0 auto; padding:80px 24px;}
  .login-card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:28px;}
  .login-card h1{font-size:19px; font-weight:600; margin:18px 0 6px;}
  .login-card .lede{font-size:13.5px; color:var(--gray); margin-bottom:22px; line-height:1.5;}
  .login-card label{margin-top:14px;}
  .login-error{font-size:13px; color:#F59E0B; margin-top:12px; display:none;}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen" style="display:none;">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">
        <span>TL</span>
        <img src="/branding/tekiminds-logo.png" alt="TekiMinds" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.remove();">
      </div>
      <div class="brand-name">TekiLive</div>
    </div>
    <h1>Admin sign-in</h1>
    <div class="lede">Overview access is limited to event admins.</div>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username">
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <button class="gradient-btn" id="loginBtn" style="width:100%; margin-top:20px;">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="wrap" id="adminWrap" style="display:none;">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <span>TL</span>
        <img src="/branding/tekiminds-logo.png" alt="TekiMinds" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.remove();">
      </div>
      <div>
        <div class="brand-name">TekiLive</div>
        <div class="brand-sub">Admin overview</div>
      </div>
    </div>
    <div class="header-actions">
      <a class="btn-outline" href="/control.html">Control console</a>
      <button class="btn-outline" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="panel">
    <div class="panel-title"><span>Active sessions</span><span id="sessionsUpdated"></span></div>
    <div class="provider-actions" style="align-items:center; margin-bottom:16px;">
      <label for="sessionLimitInput" style="margin:0;">Session limit</label>
      <input id="sessionLimitInput" type="number" min="1" max="100" style="width:90px;">
      <button class="btn-outline" id="saveLimitBtn">Save</button>
      <button class="btn-outline" id="resetLimitBtn">Reset to default</button>
      <span class="form-status" id="limitStatus" style="margin:0;"></span>
    </div>
    <div id="sessionsList"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Translation provider</div>
    <div class="provider-now" id="providerNow">Loading…</div>
    <div class="provider-warning" id="providerWarning"></div>
    <div class="provider-grid">
      <div>
        <label for="providerSelect">Switch to</label>
        <select id="providerSelect">
          <option value="deepl">DeepL</option>
          <option value="azure">Azure Translator</option>
          <option value="mymemory">MyMemory (free fallback)</option>
        </select>
      </div>
      <div data-for="deepl">
        <label for="deeplKey">DeepL API key</label>
        <input id="deeplKey" type="password" autocomplete="off" placeholder="Free keys end in :fx">
      </div>
      <div data-for="azure">
        <label for="azureKey">Azure Translator key</label>
        <input id="azureKey" type="password" autocomplete="off">
      </div>
      <div data-for="azure">
        <label for="azureRegion">Azure region</label>
        <input id="azureRegion" autocomplete="off" placeholder="e.g. westeurope">
      </div>
      <div data-for="mymemory">
        <label for="mymemoryEmail">Email (optional, raises the free limit)</label>
        <input id="mymemoryEmail" type="email" autocomplete="off">
      </div>
    </div>
    <div class="provider-actions">
      <button class="gradient-btn" id="switchProviderBtn">Test &amp; switch</button>
      <button class="btn-outline" id="resetProviderBtn">Reset to defaults</button>
    </div>
    <div class="form-status" id="providerStatus">Applies to both sessions from the next caption. A test translation runs first; if it fails, nothing changes.</div>
  </div>
</div>

<script>
const loginScreen = document.getElementById('loginScreen');
const adminWrap = document.getElementById('adminWrap');
const loginBtn = document.getElementById('loginBtn');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginError = document.getElementById('loginError');

function show(el){ [loginScreen, adminWrap].forEach(x => x.style.display = 'none'); el.style.display = 'block'; }

async function attemptLogin(){
  loginError.style.display = 'none';
  loginBtn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: loginEmail.value.trim(), password: loginPassword.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Sign-in failed');
    afterAuth(data);
  } catch (err) {
    loginError.textContent = err.message;
    loginError.style.display = 'block';
  } finally {
    loginBtn.disabled = false;
  }
}
loginBtn.addEventListener('click', attemptLogin);
loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });

async function logout(){
  await fetch('/api/auth/logout', { method: 'POST' });
  stopPolling();
  show(loginScreen);
}
document.getElementById('logoutBtn').addEventListener('click', logout);

function afterAuth(user){
  if (user.role !== 'admin') { show(loginScreen); return; }
  show(adminWrap);
  refreshSessions();
  refreshLimit();
  refreshTranslator();
  startPolling();
}

(async function bootstrap(){
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) { afterAuth(await res.json()); return; }
    show(loginScreen);
  } catch (e) {
    show(loginScreen);
  }
})();

const LANGUAGE_NAMES = { en:'English', ar:'Arabic', fr:'French', es:'Spanish', de:'German', zh:'Chinese', pt:'Portuguese', ru:'Russian', hi:'Hindi', tr:'Turkish' };

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function renderSessions(list, limit){
  const el = document.getElementById('sessionsList');
  document.getElementById('sessionsUpdated').textContent = `${list.length} of ${limit || '?'} sessions · updated ${new Date().toLocaleTimeString()}`;
  if (!list.length){
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No open sessions. A session opens when a presenter connects the console or saves branding with its code.';
    el.replaceChildren(note);
    return;
  }
  el.innerHTML = list.map(s => {
    const chips = Object.entries(s.audienceByLanguage)
      .map(([lang, count]) => `<span class="lang-chip">${escapeHtml(LANGUAGE_NAMES[lang] || lang)}: ${count}</span>`)
      .join('') || '<span class="lang-chip">No audience yet</span>';
    const eventLine = s.branding.eventName || s.branding.orgName
      ? `${escapeHtml(s.branding.eventName || '')}${s.branding.eventName && s.branding.orgName ? ' — ' : ''}${escapeHtml(s.branding.orgName || '')}`
      : 'No event branding set';
    return `
      <div class="session-card">
        <div class="session-card-top">
          <div>
            <span class="session-code">${escapeHtml(s.code)}</span>
            <span class="badge ${s.speakerConnected ? 'live' : 'idle'}" style="margin-left:8px;">${s.speakerConnected ? 'Presenter connected' : 'No presenter'}</span>
          </div>
          <span class="session-event">${eventLine}</span>
          <span>
            <button class="btn-outline copy-presenter-btn" data-code="${escapeHtml(s.code)}" data-key="${escapeHtml(s.presenterKey || '')}">Copy presenter link</button>
            <button class="btn-outline end-session-btn" data-code="${escapeHtml(s.code)}">End session</button>
          </span>
        </div>
        <div class="lang-chips">
          <span class="lang-chip">Total audience: ${s.audienceTotal}</span>
          ${chips}
        </div>
      </div>`;
  }).join('');
  el.querySelectorAll('.end-session-btn').forEach(btn => btn.addEventListener('click', () => endSession(btn.dataset.code)));
  el.querySelectorAll('.copy-presenter-btn').forEach(btn => btn.addEventListener('click', () => copyPresenterLink(btn)));
}

// The key goes after "#", so the browser never sends it to the server.
async function copyPresenterLink(btn){
  const link = `${location.origin}/present.html?session=${encodeURIComponent(btn.dataset.code)}#key=${encodeURIComponent(btn.dataset.key)}`;
  try { await navigator.clipboard.writeText(link); btn.textContent = 'Copied'; }
  catch (err) { prompt('Copy the presenter link:', link); }
  setTimeout(() => { btn.textContent = 'Copy presenter link'; }, 2000);
}

// --- Session limit ------------------------------------------------------
const sessionLimitInput = document.getElementById('sessionLimitInput');
const limitStatus = document.getElementById('limitStatus');

function renderLimit(s){
  sessionLimitInput.value = s.maxSessions;
  limitStatus.classList.remove('error');
  limitStatus.textContent = s.source === 'admin'
    ? `Set here (default from server settings: ${s.defaultMaxSessions}). Lowering it never closes open sessions.`
    : `Default from server settings. Lowering it never closes open sessions.`;
}

async function refreshLimit(){
  try {
    const res = await fetch('/api/admin/settings');
    if (res.ok) renderLimit(await res.json());
  } catch (e) {}
}

async function sendLimit(method, body){
  try {
    const res = await fetch('/api/admin/settings', { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not change the limit');
    renderLimit(data);
    refreshSessions();
  } catch (err) {
    limitStatus.textContent = err.message;
    limitStatus.classList.add('error');
  }
}
document.getElementById('saveLimitBtn').addEventListener('click', () => sendLimit('POST', { maxSessions: Number(sessionLimitInput.value) }));
document.getElementById('resetLimitBtn').addEventListener('click', () => sendLimit('DELETE'));

// Closes every console and phone on the session and frees its slot.
async function endSession(code){
  if (!confirm(`End session ${code}? Its presenter console and every attendee are disconnected, and its branding is removed.`)) return;
  try {
    const res = await fetch(`/api/admin/sessions/${encodeURIComponent(code)}`, { method: 'DELETE' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not end the session');
  } catch (err) {
    alert(err.message);
  }
  refreshSessions();
}

async function refreshSessions(){
  try {
    const res = await fetch('/api/admin/sessions');
    if (res.ok) renderSessions(await res.json(), Number(res.headers.get('X-Session-Limit')));
  } catch (e) {}
}

// --- Translation provider ---------------------------------------------
// The server never returns a full key, only its last 4 characters.
const providerSelect = document.getElementById('providerSelect');
const providerStatus = document.getElementById('providerStatus');
const switchProviderBtn = document.getElementById('switchProviderBtn');
const resetProviderBtn = document.getElementById('resetProviderBtn');
const providerInputs = ['deeplKey', 'azureKey', 'azureRegion', 'mymemoryEmail'].map(id => document.getElementById(id));

function showProviderFields(){
  document.querySelectorAll('[data-for]').forEach(el => {
    el.style.display = el.dataset.for === providerSelect.value ? 'block' : 'none';
  });
}
providerSelect.addEventListener('change', showProviderFields);
showProviderFields();

function setProviderStatus(text, isError){
  providerStatus.textContent = text;
  providerStatus.classList.toggle('error', !!isError);
}

function renderProvider(s){
  const details = [s.key ? `key ${s.key}` : null, s.region ? `region ${s.region}` : null].filter(Boolean).join(', ');
  const where = s.source === 'admin' ? 'set from this dashboard' : 'default from server settings';
  document.getElementById('providerNow').textContent = `Active: ${s.providerName}${details ? ` (${details})` : ''}, ${where}.`;
  const warning = document.getElementById('providerWarning');
  warning.textContent = s.warning || '';
  warning.style.display = s.warning ? 'block' : 'none';
  resetProviderBtn.disabled = s.source !== 'admin';
}

async function refreshTranslator(){
  try {
    const res = await fetch('/api/admin/translator');
    if (res.ok) renderProvider(await res.json());
  } catch (e) {}
}

switchProviderBtn.addEventListener('click', async () => {
  const provider = providerSelect.value;
  const body = { provider };
  if (provider === 'deepl') body.deeplKey = document.getElementById('deeplKey').value.trim();
  if (provider === 'azure') {
    body.azureKey = document.getElementById('azureKey').value.trim();
    body.azureRegion = document.getElementById('azureRegion').value.trim();
  }
  if (provider === 'mymemory') body.mymemoryEmail = document.getElementById('mymemoryEmail').value.trim();
  switchProviderBtn.disabled = true;
  setProviderStatus('Testing the new settings…');
  try {
    const res = await fetch('/api/admin/translator', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Switch failed');
    renderProvider(data);
    providerInputs.forEach(input => { input.value = ''; });
    setProviderStatus(`Switched to ${data.providerName}. Captions use it from the next chunk.`);
  } catch (err) {
    setProviderStatus(err.message, true);
  } finally {
    switchProviderBtn.disabled = false;
  }
});

resetProviderBtn.addEventListener('click', async () => {
  if (!confirm('Go back to the provider from the server settings?')) return;
  try {
    const res = await fetch('/api/admin/translator', { method: 'DELETE' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Reset failed');
    renderProvider(data);
    setProviderStatus(`Back to ${data.providerName} from the server settings.`);
  } catch (err) {
    setProviderStatus(err.message, true);
  }
});

let pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(refreshSessions, 5000);
}
function stopPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}
</script>
</body>
</html>
